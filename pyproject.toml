[project]
name = "board-tracker"
version = "0.1.0"
description = "Track who has which lab board"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
