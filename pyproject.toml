[project]
name = "btrack"
version = "0.1.0"
description = "Track who has which lab asset, and who is using which FPGAs"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.8.0",
    "fastapi>=0.143.0",
    "google-auth>=2.62.0",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    # Local only. uvicorn runs the app outside Workers; its C extensions have no
    # WASM wheels, so it must stay out of the runtime dependencies.
    "uvicorn[standard]>=0.54.0",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Dependencies that pywrangler vendors in for the Worker bundle.
extend-exclude = ["python_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
