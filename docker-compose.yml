services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/tracker.db
    ports:
      # Only reachable from this machine; Caddy terminates HTTPS in front of it.
      - "127.0.0.1:8000:8000"
    volumes:
      - tracker-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # Named volume holding the SQLite database; survives rebuilds and `docker compose down`.
  tracker-data:
