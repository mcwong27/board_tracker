{% extends "base.html" %}
{% block title %}Dev login · Board Tracker{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Dev login</h1>
  <p>Local testing only. Any @berkeley.edu address is accepted without a password.</p>
  {% if error %}<p class="banner error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ path('/dev-login') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" required autofocus></label>
    <label>Name <input type="text" name="name"></label>
    <button>Sign in</button>
  </form>
</section>
{% endblock %}
